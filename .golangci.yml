# golangci-lint v2 configuration. The linter set is the one named in the repo
# CI spec. Demonstration code that intentionally violates a lint (e.g. Module
# 05's deliberately misaligned struct) carries a documented `//nolint:<name>`
# with a reason; nothing is silenced as a blanket "mitigation".
version: "2"

linters:
  default: none
  enable:
    - errcheck # unchecked errors (the #[must_use] gap; Module 04)
    - govet
    - staticcheck
    - bodyclose # unclosed http.Response.Body
    - nilerr # returning nil after a non-nil err
    - contextcheck # context propagation
    - gosec # security lints
  settings:
    govet:
      enable:
        - fieldalignment # struct padding (Module 05)
  exclusions:
    rules:
      # Exercise stubs return zero values that trip nilerr/errcheck by design.
      - path: exercises/
        linters:
          - errcheck
          - nilerr
      # tools/capture is a trusted build-time tool: it reads repo files by path,
      # writes world-readable READMEs (0644), and runs commands declared in the
      # repo's own capture.json. gosec's file-inclusion (G304), write-perms
      # (G306), and subprocess (G204) findings flag exactly that intended
      # behavior, not untrusted-input handling. Documented, reviewed exclusion.
      - path: tools/capture/
        linters:
          - gosec
      # Module 13 demonstrates `unsafe` deliberately; gosec G103 (use of unsafe)
      # would flag every line that is the module's whole subject.
      - path: 13-unsafe/
        linters:
          - gosec
