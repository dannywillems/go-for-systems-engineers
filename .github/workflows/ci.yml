name: ci

# Toolchain versions live here as variables (override in one place). Every job
# runs the SAME `make` targets used locally, so `make ci` reproduces CI exactly.
# All non-trivial shell lives in scripts/ (shellchecked by the `shell` job).
env:
  GO_VERSION: "1.26.5"
  RUST_VERSION: "1.92.0"
  OCAML_VERSION: "5.4.0"
  SWIFT_VERSION: "6.2.3"
  KOTLIN_VERSION: "2.4.10"
  KTLINT_VERSION: "1.8.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly link-liveness check (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all scripts
        run: shellcheck scripts/*.sh scripts/ci/*.sh

  # Link liveness is checked weekly and on demand, NOT on every push: external
  # links are flaky and some hosts block CI bots, so a transient failure must
  # not block a code change. Fails only on 000/404/410 (see the script).
  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check every markdown link is live
        run: bash scripts/check-links.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: bash scripts/ci/install-go-tools.sh
      - run: make build-go
      - run: make lint-go
      - name: test (race, -count=2; concurrency modules use -count=10)
        run: make test-race
      - name: sum-type exhaustiveness analyzer (Module 02)
        run: make exhaustive
      - run: make solutions
      - run: make vuln

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make build-rust
      - run: make test-rust
      - run: make lint-rust

  ocaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - run: opam install dune ocamlformat --yes
      - run: make build-ocaml OPAM="opam exec --"
      - run: make test-ocaml OPAM="opam exec --"
      - run: make lint-ocaml OPAM="opam exec --"

  swift:
    # macos-15 ships Swift 6 (macos-14 has Swift 5.10, too old for our packages).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: make build-swift
      - run: make test-swift
      - run: make lint-swift

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: fwilhe2/setup-kotlin@main
        with:
          version: ${{ env.KOTLIN_VERSION }}
      - run: bash scripts/ci/install-ktlint.sh "${{ env.KTLINT_VERSION }}"
      - run: make build-kotlin
      - run: make test-kotlin
      - run: make lint-kotlin

  # The falsifiability gate: regenerate every portable captured block and fail on
  # any drift. Needs all five toolchains, so it runs on macOS mirroring the
  # author's environment (arch-specific blocks are portable:false, skipped by
  # -check; but `make docs` regenerates everything, so drift there is caught by
  # git diff).
  docs-fresh:
    # macos-15 for Swift 6; needs all five toolchains to regenerate every block.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - run: opam install dune --yes
      - name: Install Kotlin + ktlint
        run: brew install kotlin ktlint
      - name: Check portable captured blocks are fresh
        run: bash scripts/ci/docs-fresh.sh
      - name: Verify every reject-* demo still fails to compile as documented
        run: bash scripts/ci/check-rejects.sh

  generate-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: bash scripts/ci/generate-fresh.sh

  # Benchmarks run ONLY on manual dispatch: shared CI runners are too noisy for
  # reliable timing, so the committed bench.txt summaries are the source of truth
  # and are regenerated deliberately, never on every push.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: bash scripts/ci/bench.sh
